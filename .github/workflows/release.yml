name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches module.info
        run: |
          v=$(sed -n 's/^version=//p' module.info)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but module.info says $v"; exit 1; }
      - name: Build
        run: make dist
      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls *.wbm.gz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$f" --title "$GITHUB_REF_NAME" --notes-from-tag
          fi
